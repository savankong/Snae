name: CI

# A pull request and a push to the same branch would otherwise run every job
# twice. Pushes are scoped to the default branch; everything else is covered by
# the pull_request trigger.
on:
  pull_request:
  push:
    branches: [claude/busy-allen-71pdth]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Runs before install so a stale lockfile gives a clear message rather
      # than npm ci's wall of usage text.
      - name: Lockfile in sync with workspaces
        run: node scripts/check-lockfile.mjs

      - run: npm ci --no-audit --no-fund

      # Money and presence rules are the ones worth failing a build over.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # This app handles payments; a known-vulnerable dependency fails the build.
      - run: npm audit --omit=dev --audit-level=high
